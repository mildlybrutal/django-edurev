name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: placement
          POSTGRES_USER: placement
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U placement" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://placement:ci-only-password@localhost:5432/placement
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_SETTINGS_MODULE: config.settings.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply to an empty database
        run: python manage.py migrate --noinput
      - name: Tests
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=70
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file openapi.yml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.yml
      - name: Dependency audit
        run: pip-audit -r requirements/base.txt

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend
      - name: Generated API types match the backend schema
        run: npx openapi-typescript openapi.yml -o lib/api/schema.d.ts && git diff --exit-code lib/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Local environment (CI-only secrets)
        run: |
          cp .env.example .env
          PW=$(openssl rand -hex 16)
          sed -i "s|DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 32)|; s|POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$PW|; s|placement:change-me@|placement:$PW@|" .env
          echo "THROTTLE_LOGIN=60/min" >> .env
          sed -i "s|RESUME_S3_ACCESS_KEY=.*|RESUME_S3_ACCESS_KEY=$(openssl rand -hex 10)|; s|RESUME_S3_SECRET_KEY=.*|RESUME_S3_SECRET_KEY=$(openssl rand -hex 20)|" .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the frontend
        run: timeout 300 bash -c 'until curl -sf http://localhost:3000/login >/dev/null; do sleep 3; done'
      - name: Seed synthetic demo data
        run: docker compose exec -T backend python manage.py seed_demo --password "ci-demo-password-1"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: End-to-end journey and accessibility
        working-directory: frontend
        env:
          E2E_PASSWORD: ci-demo-password-1
        run: npm run e2e
      - if: failure()
        run: docker compose logs --tail=200 backend worker frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
